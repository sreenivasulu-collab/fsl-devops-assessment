name: CI Pipeline

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [devel, stage, prod]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 🔍 Detect project directory dynamically
      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run ESLint
        run: npm run lint
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Check Prettier formatting
        run: npm run prettier --check
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run unit tests
        run: CI=true npm run test -- --watchAll=false
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build application
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build React app
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      # ====================================================
      # ================ DEVEL DEPLOYMENT ==================
      # ====================================================
      - name: Configure AWS credentials (devel)
        if: github.ref_name == 'devel'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEVEL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEVEL }}
          aws-region: ${{ vars.AWS_REGION_DEVEL }}

      - name: Deploy to S3 (devel)
        if: github.ref_name == 'devel'
        run: |
          BUCKET="${{ vars.S3_BUCKET_DEVEL }}"
          DIST_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID_DEVEL }}"
          echo "🚀 Deploying to DEVEL bucket: $BUCKET"
          aws s3 sync build/ "s3://$BUCKET" --delete --only-show-errors
          echo "🧹 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          echo "✅ Deployment complete for DEVEL environment"

      # ====================================================
      # ================ STAGE DEPLOYMENT ==================
      # ====================================================
      - name: Configure AWS credentials (stage)
        if: github.ref_name == 'stage'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}
          aws-region: ${{ vars.AWS_REGION_STAGE }}

      - name: Deploy to S3 (stage)
        if: github.ref_name == 'stage'
        run: |
          BUCKET="${{ vars.S3_BUCKET_STAGE }}"
          DIST_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID_STAGE }}"
          echo "🚀 Deploying to STAGE bucket: $BUCKET"
          aws s3 sync build/ "s3://$BUCKET" --delete --only-show-errors
          echo "🧹 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          echo "✅ Deployment complete for STAGE environment"

      # ====================================================
      # ================ PROD DEPLOYMENT ===================
      # ====================================================
      - name: Configure AWS credentials (prod)
        if: github.ref_name == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ vars.AWS_REGION_PROD }}

      - name: Deploy to S3 (prod)
        if: github.ref_name == 'prod'
        run: |
          BUCKET="${{ vars.S3_BUCKET_PROD }}"
          DIST_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }}"
          echo "🚀 Deploying to PROD bucket: $BUCKET"
          aws s3 sync build/ "s3://$BUCKET" --delete --only-show-errors
          echo "🧹 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          echo "✅ Deployment complete for PROD environment"

      # ====================================================
      # =================== SUMMARY ========================
      # ====================================================
      - name: ✅ Deployment summary
        run: |
          echo "🎉 Deployment complete for branch: ${{ github.ref_name }}"
