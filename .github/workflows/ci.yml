name: CI Pipeline

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [devel, stage, prod]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 🔍 Detect project directory dynamically
      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run ESLint
        run: npm run lint
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Check Prettier formatting
        run: npm run prettier --check
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run unit tests
        run: CI=true npm run test -- --watchAll=false
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build application
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/devel') || startsWith(github.ref, 'refs/heads/stage') || startsWith(github.ref, 'refs/heads/prod')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build React app
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Load environment configuration
        id: set-env
        shell: bash
        env:
          # ✅ Repo-level variables — GitHub evaluates these before bash runs
          AWS_REGION_DEVEL: ${{ vars.AWS_REGION_DEVEL }}
          AWS_REGION_STAGE: ${{ vars.AWS_REGION_STAGE }}
          AWS_REGION_PROD: ${{ vars.AWS_REGION_PROD }}
          S3_BUCKET_DEVEL: ${{ vars.S3_BUCKET_DEVEL }}
          S3_BUCKET_STAGE: ${{ vars.S3_BUCKET_STAGE }}
          S3_BUCKET_PROD: ${{ vars.S3_BUCKET_PROD }}
          CLOUDFRONT_DISTRIBUTION_ID_DEVEL: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_DEVEL }}
          CLOUDFRONT_DISTRIBUTION_ID_STAGE: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_STAGE }}
          CLOUDFRONT_DISTRIBUTION_ID_PROD: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }}
        run: |
          # Export all provided GitHub variables into the shell
          export $(compgen -e | grep -E 'AWS_REGION_|S3_BUCKET_|CLOUDFRONT_DISTRIBUTION_ID_') >/dev/null 2>&1

          # ✅ Universal branch detection (works for push + PR)
          if [ -n "${GITHUB_HEAD_REF}" ]; then
            BRANCH_NAME=$(echo "${GITHUB_HEAD_REF}" | tr -d '\r\n ' | xargs)
          else
            BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr -d '\r\n ' | xargs)
          fi

          echo "🔹 Current branch (sanitized): '$BRANCH_NAME'"

          # 🔍 Debug: verify variable visibility
          echo "Debug: S3_BUCKET_DEVEL = '$S3_BUCKET_DEVEL'"
          echo "Debug: S3_BUCKET_STAGE = '$S3_BUCKET_STAGE'"
          echo "Debug: S3_BUCKET_PROD  = '$S3_BUCKET_PROD'"

          # Assign environment-specific credentials and variables
          case "$BRANCH_NAME" in
            devel)
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEVEL }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEVEL }}" >> $GITHUB_ENV
              echo "AWS_REGION=$AWS_REGION_DEVEL" >> $GITHUB_ENV
              echo "S3_BUCKET_RAW=$S3_BUCKET_DEVEL" >> $GITHUB_ENV
              echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID_DEVEL" >> $GITHUB_ENV
              ;;
            stage)
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}" >> $GITHUB_ENV
              echo "AWS_REGION=$AWS_REGION_STAGE" >> $GITHUB_ENV
              echo "S3_BUCKET_RAW=$S3_BUCKET_STAGE" >> $GITHUB_ENV
              echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID_STAGE" >> $GITHUB_ENV
              ;;
            prod)
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}" >> $GITHUB_ENV
              echo "AWS_REGION=$AWS_REGION_PROD" >> $GITHUB_ENV
              echo "S3_BUCKET_RAW=$S3_BUCKET_PROD" >> $GITHUB_ENV
              echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID_PROD" >> $GITHUB_ENV
              ;;
            *)
              echo "❌ Unsupported branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

          # ✅ Trim and validate bucket
          CLEAN_BUCKET=$(echo "$S3_BUCKET_RAW" | tr -d '\r\n ' | xargs)
          if [ -z "$CLEAN_BUCKET" ]; then
            echo "❌ ERROR: S3_BUCKET_RAW is empty after assignment. Check variable names or values."
            exit 1
          fi

          echo "S3_BUCKET=$CLEAN_BUCKET" >> $GITHUB_ENV
          echo "✅ Bucket resolved to: $CLEAN_BUCKET"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug bucket name
        run: |
          echo "✅ Final bucket: '$S3_BUCKET'"
          echo "✅ Length: ${#S3_BUCKET}"

      - name: Validate S3 and CloudFront resources
        run: |
          echo "Using bucket: $S3_BUCKET in region $AWS_REGION"
          echo "CloudFront distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          aws s3api head-bucket --bucket "$S3_BUCKET" || { echo "❌ S3 bucket not found or invalid"; exit 1; }

      - name: Deploy to S3
        run: |
          echo "🚀 Syncing files to s3://$S3_BUCKET ..."
          aws s3 sync build/ s3://"$S3_BUCKET" --delete --only-show-errors
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Invalidate CloudFront cache
        run: |
          echo "🧹 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

      - name: ✅ Deployment summary
        run: |
          echo "🎉 Deployment complete for branch '$BRANCH_NAME'"
          echo "🪣 Bucket: $S3_BUCKET"
          echo "🌐 CloudFront: $CLOUDFRONT_DISTRIBUTION_ID"
