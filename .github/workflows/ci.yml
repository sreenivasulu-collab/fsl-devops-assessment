name: CI Pipeline

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [devel, stage, prod]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 🔍 Detect project directory dynamically
      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run ESLint
        run: npm run lint
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Check Prettier formatting
        run: npm run prettier --check
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run unit tests
        run: CI=true npm run test -- --watchAll=false
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build application
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build React app
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      # =========================================================
      # =================== UNIFIED DEPLOY ======================
      # =========================================================
      - name: Deploy to correct environment
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          PROJECT_DIR: ${{ env.PROJECT_DIR }}

          # AWS credentials
          AWS_ACCESS_KEY_ID_DEVEL: ${{ secrets.AWS_ACCESS_KEY_ID_DEVEL }}
          AWS_SECRET_ACCESS_KEY_DEVEL: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEVEL }}
          AWS_ACCESS_KEY_ID_STAGE: ${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}
          AWS_SECRET_ACCESS_KEY_STAGE: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}
          AWS_ACCESS_KEY_ID_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}

          # Variables
          AWS_REGION_DEVEL: ${{ vars.AWS_REGION_DEVEL }}
          AWS_REGION_STAGE: ${{ vars.AWS_REGION_STAGE }}
          AWS_REGION_PROD: ${{ vars.AWS_REGION_PROD }}
          S3_BUCKET_DEVEL: ${{ vars.S3_BUCKET_DEVEL }}
          S3_BUCKET_STAGE: ${{ vars.S3_BUCKET_STAGE }}
          S3_BUCKET_PROD: ${{ vars.S3_BUCKET_PROD }}
          CF_ID_DEVEL: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_DEVEL }}
          CF_ID_STAGE: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_STAGE }}
          CF_ID_PROD: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }}

        run: |
          echo "🔹 Branch detected: $BRANCH_NAME"

          case "$BRANCH_NAME" in
            devel)
              export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_DEVEL"
              export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_DEVEL"
              export AWS_REGION="$AWS_REGION_DEVEL"
              BUCKET="$S3_BUCKET_DEVEL"
              DIST_ID="$CF_ID_DEVEL"
              ;;
            stage)
              export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_STAGE"
              export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_STAGE"
              export AWS_REGION="$AWS_REGION_STAGE"
              BUCKET="$S3_BUCKET_STAGE"
              DIST_ID="$CF_ID_STAGE"
              ;;
            prod)
              export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID_PROD"
              export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY_PROD"
              export AWS_REGION="$AWS_REGION_PROD"
              BUCKET="$S3_BUCKET_PROD"
              DIST_ID="$CF_ID_PROD"
              ;;
            *)
              echo "❌ Unsupported branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

          echo "🧩 Environment: $BRANCH_NAME"
          echo "🌍 Region: $AWS_REGION"
          echo "🪣 Bucket: $BUCKET"
          echo "☁️ CloudFront ID: $DIST_ID"
          echo "📂 Project directory: $PROJECT_DIR"

          # ✅ Validate build path
          if [ ! -d "$PROJECT_DIR/build" ]; then
            echo "❌ Build folder not found at: $PROJECT_DIR/build"
            echo "🧠 Trying fallback search..."
            ALT_BUILD=$(find . -type d -name build | head -n 1)
            if [ -z "$ALT_BUILD" ]; then
              echo "🚨 No build folder found anywhere in repo!"
              exit 1
            else
              echo "✅ Found build folder at: $ALT_BUILD"
              PROJECT_DIR=$(dirname "$ALT_BUILD")
            fi
          fi

          # ✅ Deploy to S3
          echo "🚀 Syncing $PROJECT_DIR/build → s3://$BUCKET"
          aws s3 sync "$PROJECT_DIR/build/" "s3://$BUCKET" --region "$AWS_REGION" --delete --only-show-errors || {
            echo "❌ S3 sync failed"; exit 1;
          }

          # ✅ Invalidate CloudFront cache
          echo "🧹 Invalidating CloudFront cache..."
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" || {
            echo "❌ CloudFront invalidation failed"; exit 1;
          }

          echo "✅ Deployment successful for environment: $BRANCH_NAME"

      - name: ✅ Deployment summary
        run: |
          echo "🎉 Deployment complete for branch: ${{ github.ref_name }}"
          echo "🪣 Bucket: ${{ env.S3_BUCKET_STAGE }}"
          echo "🌐 CloudFront ID: ${{ env.CF_ID_STAGE }}"
