name: CI Pipeline

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [devel, stage, prod]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 🔍 Dynamically find project directory that contains package.json
      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run ESLint
        run: npm run lint
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Check Prettier formatting
        run: npm run prettier --check
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Run unit tests
        run: CI=true npm run test -- --watchAll=false
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build application
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/prod'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect project directory
        id: detect-dir
        run: |
          PROJECT_DIR=$(find . -type f -name package.json -exec dirname {} \; | head -n 1)
          echo "📁 Detected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build React app
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Load environment configuration
        id: set-env
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          echo "🔹 Current branch: $BRANCH_NAME"

          case "$BRANCH_NAME" in
            devel)
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEVEL }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEVEL }}" >> $GITHUB_ENV
              echo "AWS_REGION=${{ vars.AWS_REGION_DEVEL }}" >> $GITHUB_ENV
              echo "S3_BUCKET=${{ vars.S3_BUCKET_DEVEL }}" >> $GITHUB_ENV
              echo "CLOUDFRONT_DISTRIBUTION_ID=${{ vars.CLOUDFRONT_DISTRIBUTION_ID_DEVEL }}" >> $GITHUB_ENV
              ;;
            stage)
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}" >> $GITHUB_ENV
              echo "AWS_REGION=${{ vars.AWS_REGION_STAGE }}" >> $GITHUB_ENV
              echo "S3_BUCKET=${{ vars.S3_BUCKET_STAGE }}" >> $GITHUB_ENV
              echo "CLOUDFRONT_DISTRIBUTION_ID=${{ vars.CLOUDFRONT_DISTRIBUTION_ID_STAGE }}" >> $GITHUB_ENV
              ;;
            prod)
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}" >> $GITHUB_ENV
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}" >> $GITHUB_ENV
              echo "AWS_REGION=${{ vars.AWS_REGION_PROD }}" >> $GITHUB_ENV
              echo "S3_BUCKET=${{ vars.S3_BUCKET_PROD }}" >> $GITHUB_ENV
              echo "CLOUDFRONT_DISTRIBUTION_ID=${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate S3 and CloudFront resources
        run: |
          echo "Using bucket: $S3_BUCKET in region $AWS_REGION"
          echo "CloudFront distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          aws s3api head-bucket --bucket $S3_BUCKET || { echo "S3 bucket not found"; exit 1; }

      - name: Deploy to S3
        run: |
          aws s3 sync build/ s3://$S3_BUCKET --delete --only-show-errors
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
